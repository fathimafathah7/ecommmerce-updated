<div
  class="group flex h-full flex-col overflow-hidden
         rounded-2xl border border-[#DCC8B8]
         bg-[#FFFDF8]
         transition-all duration-300
         hover:-translate-y-1
         hover:border-[#6B574D]
         hover:shadow-[0_18px_40px_rgba(47,39,36,0.10)]"
>

  <a
    [routerLink]="['/products', product().id]"
    class="block flex-1"
  >

   <!-- Product Image -->
<div
  class="relative h-60 overflow-hidden
         bg-[#F5EFE6]"
>
  <img
    [src]="product().images[0]"
    [alt]="product().name"
    loading="lazy"
    class="h-full w-full object-cover
           transition-transform duration-500
           group-hover:scale-[1.04]"
  >

  <!-- Wishlist -->
  <div class="absolute right-3 top-3">
    <app-wishlist-button
      [product]="product()"
      size="md"
    />
  </div>
</div>


<!-- Product Info -->
<div class="p-4">

  <!-- Category -->
  <p
    class="text-[10px] font-semibold uppercase
           tracking-[0.16em] text-[#6B574D]"
  >
    {{ product().category }}
  </p>

  <!-- Product Name -->
  <h2
    class="mt-1 min-h-[2.5rem]
           line-clamp-4
           text-base font-semibold leading-5
           text-[#2F2724]
           transition-colors
           group-hover:text-[#6B574D]"
  >
    {{ product().name }}
  </h2>

  <!-- Rating -->
  <div class="mt-1 flex items-center gap-2">
    <span class="text-sm text-[#6B574D]">
      ★
    </span>

    <span class="text-xs text-[#6B625D]">
      {{ product().rating }}
    </span>
  </div>

  <!-- Price -->
  <p
    class="mt-2 text-2xl font-semibold
           text-[#3B302C]"
  >
    ₹{{ product().price }}
  </p>

  <!-- Stock -->
  @if (product().stock > 0) {
    <p class="mt-2 text-xs font-medium text-[#6B574D]">
      In stock
    </p>
  } @else {
    <p class="mt-1 text-xs font-medium text-[#8A4F43]">
      Out of stock
    </p>
  }

</div>


<!-- Actions -->
<div class="px-4 pb-4">

  <div class="flex gap-2">

    <button
      type="button"
      (click)="addToCart($event)"
      [disabled]="product().stock === 0"
      class="flex-1 rounded-full
             border border-[#DCC8B8]
             px-3 py-2
             text-xs font-medium
             text-[#6B574D]
             transition-all duration-200
             hover:border-[#3B302C]
             hover:bg-[#F5EFE6]
             hover:text-[#2F2724]
             disabled:cursor-not-allowed
             disabled:opacity-40"
    >
      Add to Cart
    </button>

    
  <button
    type="button"
    (click)="buyNow($event)"
    [disabled]="product().stock === 0"
    class="flex-1 rounded-full
           bg-[#3B302C]
           px-3 py-2
           text-xs font-semibold
           text-[#FFFDF8]
           transition-all duration-300
           hover:bg-[#2F2724]
           hover:shadow-md
           disabled:cursor-not-allowed
           disabled:bg-[#B8ADA3]"
  >
    Buy Now
  </button>

  </div>


</div>
