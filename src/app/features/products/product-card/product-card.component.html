<div
  class="group flex h-full flex-col overflow-hidden
         rounded-2xl border border-[#E7E2D9]
         bg-white
         transition-all duration-300
         hover:-translate-y-1
         hover:border-[#D4CCBF]
         hover:shadow-[0_18px_40px_rgba(41,39,35,0.08)]"
>

<a
[routerLink]="['/products', product().id]"
class="block flex-1"

>

<!-- Product Image -->
<div class="relative h-64 overflow-hidden bg-[#F5F3EE]">

  <img
    [src]="product().image"
    [alt]="product().name"
    loading="lazy"
    class="h-full w-full object-cover
           transition-transform duration-500
           group-hover:scale-[1.04]"
  >

  <!-- Wishlist -->
  <div class="absolute right-3 top-3">
    <app-wishlist-button
      [product]="product()"
      size="md"
    />
  </div>

</div>


<!-- Product Info -->
<div class="p-5">

  <p class="text-[10px] font-semibold uppercase tracking-[0.16em] text-[#9A8063]">
    {{ product().category }}
  </p>

  <h2
    class="mt-2 min-h-[3rem]
           line-clamp-2
           text-base font-semibold leading-6
           text-[#292723]
           transition-colors
           group-hover:text-[#8B6F52]"
  >
    {{ product().name }}
  </h2>


  <!-- Rating -->
  <div class="mt-3 flex items-center gap-2">

    <span class="text-sm text-[#A07C4D]">
      ★
    </span>

    <span class="text-xs text-[#817B72]">
      {{ product().rating }}
    </span>

  </div>


  <!-- Price -->
  <p class="mt-3 text-lg font-semibold text-[#292723]">
    ₹{{ product().price }}
  </p>


  <!-- Stock -->
  @if (product().stock > 0) {

    <p class="mt-1 text-xs font-medium text-[#6E8069]">
      In stock
    </p>

  } @else {

    <p class="mt-1 text-xs font-medium text-[#9A5B52]">
      Out of stock
    </p>

  }

</div>


  </a>

  <!-- Actions -->

  <div class="px-5 pb-5">


<div class="flex gap-2">

  <button
    type="button"
    (click)="addToCart($event)"
    [disabled]="product().stock === 0"
    class="flex-1 rounded-full
           border border-[#D9D3C9]
           px-3 py-2.5
           text-xs font-medium text-[#4E4942]
           transition-all duration-200
           hover:border-[#8B6F52]
           hover:bg-[#F7F5F0]
           disabled:cursor-not-allowed
           disabled:opacity-40"
  >
    Add to Cart
  </button>

  <button
    type="button"
    (click)="viewDetails.emit(product().id)"
    class="flex-1 rounded-full
           border border-[#D9D3C9]
           px-3 py-2.5
           text-xs font-medium text-[#4E4942]
           transition-all duration-200
           hover:border-[#8B6F52]
           hover:bg-[#F7F5F0]"
  >
    Details
  </button>

</div>


<button
  type="button"
  (click)="buyNow($event)"
  [disabled]="product().stock === 0"
  class="mt-2 w-full rounded-full
         bg-[#292723]
         px-3 py-2.5
         text-xs font-semibold text-white
         transition-all duration-300
         hover:bg-[#8B6F52]
         disabled:cursor-not-allowed
         disabled:bg-[#D7D3CB]"
>
  Buy Now
</button>


  </div>

</div>
