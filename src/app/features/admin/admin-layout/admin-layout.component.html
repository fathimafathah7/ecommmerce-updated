<div class="flex h-screen overflow-hidden bg-[#F7F5F0]">

  <!-- Sidebar -->
  <aside
    class="fixed inset-y-0 left-0 hidden w-64 shrink-0 flex-col
           border-r border-[#E5E0D7] bg-white md:flex"
  >

    <div class="flex items-center gap-2 border-b border-[#EAE6DE] px-6 py-5">
      <span class="text-xl font-semibold tracking-[-0.03em] text-[#292723]">
        Toy<span class="text-[#8B6F52]">Store</span>
      </span>

      <span
        class="rounded-full bg-[#292723] px-2 py-0.5 text-[10px]
               font-semibold uppercase tracking-wide text-white"
      >
        Admin
      </span>
    </div>


    <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-5">

      @for (link of navLinks; track link.path) {

        <a
          [routerLink]="link.path"
          routerLinkActive="bg-[#292723] text-white"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium
                 text-[#716C64] transition hover:bg-[#E8DDC6] hover:text-[#292723]"
        >
          {{ link.label }}
        </a>

      }

    </nav>


    <div class="border-t border-[#EAE6DE] p-3">

      <button
        type="button"
        (click)="logout()"
        class="mt-1 flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium
               text-[#9A5B52] transition hover:bg-[#FBF4F2]"
      >
        Logout
      </button>

    </div>

  </aside>


  <!-- Main -->
  <div class="ml-0 flex min-w-0 flex-1 flex-col md:ml-64">

    <!-- Top bar -->
    <header
      class="sticky top-0 z-30 border-b border-[#E5E0D7]
             bg-white px-5 py-4 md:px-8"
    >

      <div class="flex items-center justify-between">

        <div>
          <p
            class="text-xs font-semibold uppercase tracking-[0.18em] text-[#9A8063]"
          >
            Admin Panel
          </p>

          <p class="mt-0.5 text-sm text-[#716C64]">
            Signed in as {{ adminName }}
          </p>
        </div>

      </div>


      <!-- Mobile nav row -->
      <nav class="mt-4 flex gap-2 overflow-x-auto md:hidden">

        @for (link of navLinks; track link.path) {

          <a
            [routerLink]="link.path"
            routerLinkActive="bg-[#292723] text-white"
            [routerLinkActiveOptions]="{ exact: false }"
            class="whitespace-nowrap rounded-full border border-[#D9D3C9] px-4 py-1.5
                   text-xs font-medium text-[#5F5A52] transition"
          >
            {{ link.label }}
          </a>

        }

      </nav>

    </header>


    <!-- Scrollable Admin Content -->
    <main class="min-h-0 flex-1 overflow-y-auto px-5 py-6 md:px-8 md:py-8">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
